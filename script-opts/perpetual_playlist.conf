# perpetual_playlist.lua options
#
# Copy this file to ~/.config/mpv/script-opts/perpetual_playlist.conf and
# uncomment/edit as needed. mpv only reads the top-level script-opts/ dir,
# never the copy inside plugins/ - this file just documents the defaults.

# Where the persisted playlist is stored (JSON: { items, current }).
# ~/.config/mpv is itself the git-tracked config repo (not a symlink into
# one) - this is kept in the XDG state dir instead so it stays out of
# version control regardless of how script-opts/*.conf itself is managed
# (e.g. symlinked in from a separate dotfiles repo).
playlist_file=~/.local/state/mpv/last_playlist.json

# How long (seconds) the "resuming saved playlist" / "playing N new items"
# OSD messages stay on screen.
osd_duration=3

# By default nothing is ever removed from the saved playlist, including
# items that finished playing. Set to yes to opt back into dropping an
# item once it's been watched to the end.
drop_finished_items=no
